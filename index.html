<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ragnarok</title>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e6ebe2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131a16" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="gate.js"></script>
    <style>
      /* Colori e caratteri sono quelli della guida Nuovo Mondo. */
      :root {
        --bg: #e6ebe2;
        --surface: #f5f7f1;
        --ink: #1d2821;
        --muted: #56655b;
        --line: #c6d0c1;
        --focus: #6a4c9c;
        --serif: "Alegreya", "Palatino Linotype", Palatino, Georgia, serif;
        --sans: "Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color-scheme: light;
      }

      /* Scuro se lo chiede il sistema, a meno che l'utente abbia scelto il chiaro
         (data-theme, messo da gate.js); oppure se l'utente ha scelto lo scuro. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #131a16;
          --surface: #1b2420;
          --ink: #e3eae2;
          --muted: #9daa9f;
          --line: #33413a;
          --focus: #b79ceb;
          color-scheme: dark;
        }
      }

      :root[data-theme="dark"] {
        --bg: #131a16;
        --surface: #1b2420;
        --ink: #e3eae2;
        --muted: #9daa9f;
        --line: #33413a;
        --focus: #b79ceb;
        color-scheme: dark;
      }

      body {
        margin: 0;
        padding: 56px 20px;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.5;
      }

      main {
        max-width: 520px;
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(2.1rem, 6vw, 2.8rem);
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }

      button {
        padding: 7px 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        font: inherit;
        font-size: 0.92rem;
        line-height: 1.2;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--muted);
      }

      button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      h2 {
        margin: 28px 0 10px;
        color: var(--muted);
        font-family: var(--serif);
        font-size: 1rem;
        font-weight: 500;
      }

      .card {
        display: block;
        margin-bottom: 10px;
        padding: 14px 16px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        color: inherit;
        text-decoration: none;
      }

      .card:hover {
        border-color: var(--muted);
      }

      .card:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .card strong {
        display: block;
        font-family: var(--serif);
        font-size: 1.25rem;
        line-height: 1.15;
      }

      .card span {
        color: var(--muted);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Ragnarok</h1>
        <button type="button" onclick="toggleTheme()">Light / dark theme</button>
      </header>

      <!-- Un servizio nuovo: una cartella sua, gate.js nel suo <head>, una scheda qui. -->
      <section>
        <h2>Timers</h2>
        <a class="card" href="timers/">
          <strong>Respawn timers</strong>
          <span>Respawn windows for MvPs and quests.</span>
        </a>
      </section>

      <section>
        <h2>Guides</h2>
        <a class="card" href="guide/nuovo-mondo.html" lang="it">
          <strong>Nuovo Mondo</strong>
          <span>uaRO, passo per passo: da Onward to the New World a El Dicastes e all'accesso al Nidhoggur's Nest.</span>
        </a>
      </section>
    </main>
  </body>
</html>
