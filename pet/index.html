<!DOCTYPE html>
<html lang="it" data-bilingual>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Promemoria pet</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F7F1">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B2420">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<script src="../gate.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Colori e caratteri sono quelli della guida Nuovo Mondo. */
:root {
  --bg: #E6EBE2;
  --surface: #F5F7F1;
  --surface-2: #EDF1E8;
  --ink: #1D2821;
  --muted: #56655B;
  --line: #C6D0C1;
  --accent: #6A4C9C;
  --warn: #A3402C;
  --focus: #6A4C9C;
  --serif: "Alegreya", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: "Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131A16; --surface: #1B2420; --surface-2: #212C27; --ink: #E3EAE2; --muted: #9DAA9F; --line: #33413A;
    --accent: #B79CEB; --warn: #F08A72; --focus: #B79CEB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131A16; --surface: #1B2420; --surface-2: #212C27; --ink: #E3EAE2; --muted: #9DAA9F; --line: #33413A;
  --accent: #B79CEB; --warn: #F08A72; --focus: #B79CEB;
  color-scheme: dark;
}
:root { box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.5;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* Intestazione, come nella guida */
.topbar {
  position: sticky; top: 0; z-index: 20;
  padding-top: env(safe-area-inset-top, 0px);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 560px; margin: 0 auto; min-height: 64px;
  display: flex; align-items: center; gap: 16px; padding: 8px 20px; flex-wrap: wrap;
}
.brand { font-family: var(--serif); font-weight: 700; font-size: 1.15rem; white-space: nowrap; flex: 1; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 7px 12px; cursor: pointer; font-size: .92rem; line-height: 1.2;
}
.btn:hover { border-color: var(--muted); }
a.btn { color: inherit; text-decoration: none; }
.btn[hidden] { display: none; }
/* Menu ⚙, copiato dalla guida */
.more { position: relative; }
.more > summary { list-style: none; }
.more > summary::-webkit-details-marker { display: none; }
.more > summary.gear { padding-left: 9px; padding-right: 9px; font-size: 1.05rem; }
.more-menu {
  position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: grid; gap: 4px; min-width: 220px;
  box-shadow: 0 10px 30px color-mix(in srgb, var(--ink) 18%, transparent);
}
.more-menu .btn { text-align: left; border-color: transparent; }
.more-menu .btn:hover { background: var(--surface-2); }

main { max-width: 560px; margin: 0 auto; padding: 28px 20px 40px; }
.conto {
  text-align: center; padding: 28px 16px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px;
}
#tempo {
  font-size: clamp(4.5rem, 22vw, 7rem); font-weight: 700; line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -.02em;
}
#stato { margin: 10px 0 0; color: var(--muted); min-height: 1.5em; }
.conto.suona { border-color: var(--warn); }
.conto.suona #tempo, .conto.suona #stato { color: var(--warn); font-weight: 700; }
.azioni { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.azioni .btn { font-size: 1.05rem; padding: 10px 22px; }
#nutrito {
  border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); font-weight: 700;
}
.minuti { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; }
.minuti input {
  width: 4.5em; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); text-align: center;
}
.hint { font-size: .9rem; color: var(--muted); margin: 16px 0 0; }
.hint[hidden] { display: none; }
#avviso-suono { color: var(--warn); }

@media (max-width: 640px) {
  .topbar-inner { gap: 10px; padding: 8px 16px; }
  main { padding-left: 16px; padding-right: 16px; }
  .topbar .btn { padding: 6px 10px; font-size: .86rem; }
  .brand { font-size: 1rem; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="btn" href="../" title="Torna alla scelta dei servizi" data-en-title="Back to the list of services">Home</a>
    <span class="brand" data-en="Pet reminder">Promemoria pet</span>
    <!-- Lingua prima del menu ⚙, come in ogni pagina: la bandiera la disegna gate.js. -->
    <button class="btn" type="button" onclick="toggleLang()" data-lang><span data-en="IT">EN</span></button>
    <!-- Menu ⚙, uguale in ogni pagina: qui solo il tema, i minuti non meritano un backup. -->
    <details class="more">
      <summary class="btn gear" title="Menu" aria-label="Menu">&#9881;</summary>
      <div class="more-menu">
        <button class="btn" type="button" onclick="toggleTheme()" data-en="Switch light/dark theme">Cambia tema chiaro/scuro</button>
      </div>
    </details>
  </div>
</header>
<main>
  <section class="conto" id="conto">
    <div id="tempo" role="timer" aria-live="off">9:00</div>
    <p id="stato" aria-live="polite"></p>
    <div class="azioni">
      <button class="btn" type="button" id="nutrito" data-en="Fed">Nutrito</button>
      <button class="btn" type="button" id="ferma" hidden data-en="Stop">Ferma</button>
    </div>
    <label class="minuti">
      <span data-en="Minutes">Minuti</span>
      <input id="minuti" type="number" min="1" max="120" step="1" value="9" inputmode="numeric">
    </label>
  </section>
  <p class="hint" data-en="Press <strong>Fed</strong> when you feed the pet: the countdown starts over. At zero it beeps until you press it again. The page must stay open, even in another tab.">Premi <strong>Nutrito</strong> quando dai da mangiare al pet: il conto riparte da capo. A zero suona finché non lo premi di nuovo. La pagina deve restare aperta, anche in un'altra scheda.</p>
  <p class="hint" id="avviso-suono" hidden data-en="The page has reloaded: click anywhere to turn the sound back on.">La pagina si è ricaricata: clicca in un punto qualsiasi per riattivare il suono.</p>
</main>
<script type="module">
await window.accessGranted;
const tr = window.tr;
const $ = (id) => document.getElementById(id);

const CHIAVE = "ragnarok-pet/stato";
const BIP_HZ = 880;
const BIP_DURATA = 0.3;
const BIP_OGNI = 2;
// oltre questo tempo senza risposta smette di suonare, ma il conto resta a zero
const SUONA_PER = 600;
const VOLUME = 0.6;

/** @type {{minuti: number, fine: number | null}} fine: istante in ms in cui suona, null se fermo */
let stato = { minuti: 9, fine: null };
try {
  stato = { ...stato, ...JSON.parse(localStorage.getItem(CHIAVE) || "{}") };
} catch {
  // senza localStorage si riparte da 9 minuti a ogni apertura
}
const salva = () => {
  try {
    localStorage.setItem(CHIAVE, JSON.stringify(stato));
  } catch {
    // come sopra
  }
};

// I bip si programmano nel motore audio all'istante giusto, non con un timer JavaScript:
// nelle schede in secondo piano il browser rallenta i timer anche di un minuto.
let audio = null;
let uscita = null;

async function sbloccaAudio() {
  try {
    audio ??= new AudioContext();
    if (audio.state === "suspended") await audio.resume();
  } catch (error) {
    console.warn("Audio non disponibile:", error);
  }
  return audio?.state === "running";
}

function annullaBip() {
  uscita?.disconnect();
  uscita = null;
}

function programmaBip() {
  annullaBip();
  if (stato.fine === null || audio?.state !== "running") return;
  uscita = audio.createGain();
  uscita.connect(audio.destination);
  const inizio = audio.currentTime + Math.max(0, (stato.fine - Date.now()) / 1000);
  for (let t = 0; t < SUONA_PER; t += BIP_OGNI) {
    const s = inizio + t;
    const volume = audio.createGain();
    // le rampe evitano il click a inizio e fine nota, come nei timer
    volume.gain.setValueAtTime(0, s);
    volume.gain.linearRampToValueAtTime(VOLUME, s + 0.01);
    volume.gain.setValueAtTime(VOLUME, s + BIP_DURATA - 0.01);
    volume.gain.linearRampToValueAtTime(0, s + BIP_DURATA);
    const nota = audio.createOscillator();
    nota.frequency.value = BIP_HZ;
    nota.connect(volume).connect(uscita);
    nota.start(s);
    nota.stop(s + BIP_DURATA);
  }
}

const formato = (secondi) => `${Math.floor(secondi / 60)}:${String(secondi % 60).padStart(2, "0")}`;

function disegna() {
  const nome = tr("Promemoria pet", "Pet reminder");
  if (stato.fine === null) {
    $("tempo").textContent = formato(stato.minuti * 60);
    $("stato").textContent = "";
    $("conto").classList.remove("suona");
    $("ferma").hidden = true;
    document.title = nome;
    return;
  }
  const resta = Math.max(0, Math.ceil((stato.fine - Date.now()) / 1000));
  const suona = resta === 0;
  $("tempo").textContent = formato(resta);
  $("stato").textContent = suona ? tr("Dai da mangiare al pet!", "Feed your pet!") : "";
  $("conto").classList.toggle("suona", suona);
  $("ferma").hidden = false;
  document.title = suona ? `Pet! – ${nome}` : `${formato(resta)} – ${nome}`;
}

$("nutrito").addEventListener("click", async () => {
  await sbloccaAudio();
  stato.fine = Date.now() + stato.minuti * 60000;
  salva();
  $("avviso-suono").hidden = true;
  programmaBip();
  disegna();
  window.conta?.("pet-nutrito");
});

$("ferma").addEventListener("click", () => {
  stato.fine = null;
  salva();
  annullaBip();
  $("avviso-suono").hidden = true;
  disegna();
});

$("minuti").value = stato.minuti;
$("minuti").addEventListener("change", () => {
  const minuti = Number($("minuti").value);
  if (Number.isInteger(minuti) && minuti >= 1 && minuti <= 120) {
    stato.minuti = minuti;
    salva();
  } else {
    $("minuti").value = stato.minuti;
  }
  disegna();
});

// Un conto ancora in corso dopo un ricaricamento (anche il cambio di lingua ricarica): il
// browser fa ripartire l'audio solo dopo un clic.
if (stato.fine !== null) {
  $("avviso-suono").hidden = false;
  const riattiva = async () => {
    if (await sbloccaAudio()) {
      programmaBip();
      $("avviso-suono").hidden = true;
      document.removeEventListener("pointerdown", riattiva);
      document.removeEventListener("keydown", riattiva);
    }
  };
  document.addEventListener("pointerdown", riattiva);
  document.addEventListener("keydown", riattiva);
}

disegna();
setInterval(disegna, 250);
</script>
</body>
</html>
